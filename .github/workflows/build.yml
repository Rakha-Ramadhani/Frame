name: Build Custom Image

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare upstream justfiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p files/justfiles

          curl -fsSL \
            https://raw.githubusercontent.com/ublue-os/bazzite/main/system_files/desktop/shared/usr/share/ublue-os/just/60-bazzite.just \
            -o files/justfiles/60-bazzite.just

          curl -fsSL \
            https://raw.githubusercontent.com/ublue-os/bluefin/main/system_files/shared/usr/share/ublue-os/just/60-bluefin.just \
            -o files/justfiles/60-bluefin.just

      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
