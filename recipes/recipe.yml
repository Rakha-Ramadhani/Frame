---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: frame-silverblue
description: Personal Fedora Silverblue image optimized for Ryzen 7 8845HS with Bazzite audio, power saving, and devtools.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      packages:
        - brave-browser
        - gnome-tweaks
        - extension-manager
        - wine
        - winetricks
        - powertop
        - gnome-clocks
        - nextcloud-client
        - nextcloud-client-nautilus
        - xournal
        - tilix
        - tilix-nautilus
        - hplip
        - sane-backends-drivers-scanners
        - simple-scan
        - hidapi
        - libvirt
        - qemu-kvm
        - solaar
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: user
        install:
          - com.mattjakeman.ExtensionManager
          - it.mijorus.gearlever
          - com.ranfdev.DistroShelf
          - io.missioncenter.MissionCenter
          - com.github.iwalton3.jellyfin-media-player
          - com.google.Chrome
          - com.visualstudio.code
          - dev.zed.Zed
          - org.gnome.Calculator
          - org.gnome.Evince
          - org.gnome.Loupe
          - org.gnome.Snapshot
          - org.gnome.TextEditor
          - org.libreoffice.LibreOffice
          - org.mozilla.firefox
          - org.videolan.VLC
          - rest.insomnia.Insomnia

      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
          - org.mozilla.firefox

  - type: systemd
    system:
      enabled:
        - power-profiles-daemon.service
        - podman.socket

  - type: script
    snippets:
      - echo "Configuring system defaults..."
      - systemctl enable podman.socket

  - type: signing
