# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: frame-silverblue
description: Personal Fedora Silverblue image optimized for Ryzen 7 8845HS with Bazzite audio, power saving, and devtools.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - type: justfiles
    include:
      - https://raw.githubusercontent.com/ublue-os/bazzite/main/system_files/desktop/shared/usr/share/ublue-os/just/60-bazzite.just
      - https://raw.githubusercontent.com/ublue-os/bluefin/main/system_files/shared/usr/share/ublue-os/just/60-bluefin.just

  - type: rpm-ostree
    repos:
      # Brave Browser Repo
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    keys:
      - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      # Primary Web Browser
      - brave-browser
      # GNOME Customization Tools
      - gnome-tweaks
      - gnome-shell-extension-installer
      - gnome-shell-extension-appindicator
      # Windows Compatibility & Wine Tools
      - wine
      - winetricks
      - lutris
      # Battery Monitoring Tool
      - powertop

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: default-flatpaks
    notify: true
    user:
      install:
        - com.mattjakeman.ExtensionManager
        - it.mijorus.gearlever
        - com.ranfdev.DistroShelf
        - io.missioncenter.MissionCenter
      remove:
        - org.mozilla.firefox

  - type: systemd
    system:
      enabled:
        - power-profiles-daemon.service
        - podman.socket

  - type: script
    snippets:
      - echo "Configuring system defaults..."
      - systemctl enable podman.socket
