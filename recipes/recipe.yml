# recipes/recipe.yml
$schema: https://blue-build.org/schema/v1/recipe.json
name: buddy-silverblue-ryzen
description: Personal Fedora Silverblue image optimized for Ryzen 7 8845HS with Bazzite audio, power saving, and devtools.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # Or set to your desired Fedora version (e.g., 41/42/latest)

modules:
  - type: files
    files:
      - usr: /usr
      - etc: /etc

  - type: rpm-ostree
    repos:
      # Brave Browser Repo
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      # RPM Fusion Free & Nonfree (For complete multimedia codecs and hardware acceleration)
      - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
      - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
    keys:
      - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      # Web Browser
      - brave-browser
      # GNOME Customization Tools
      - gnome-tweaks
      - gnome-shell-extension-installer
      - gnome-shell-extension-appindicator
      # Development & Containers
      - podman
      - podman-docker
      - distrobox
      # Gaming / Windows Compatibility & Wine Tools
      - wine
      - winetricks
      - lutris
      # Complete Multimedia Codecs & HW Acceleration (AMD Radeon Graphics 780M)
      - ffmpeg
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - gstreamer1-vaapi
      - mesa-va-drivers-freeworld
      - mesa-vdpau-drivers-freeworld
      - libva-utils
      # Power Management Optimization (Conflict-Free native tools)
      - power-profiles-daemon
      - powertop

  - type: brew
    nofile-limits: true
    brew-analytics: false

  - type: default-flatpaks
    notify: true
    scope: user
    install:
      - com.mattjakeman.ExtensionManager # GNOME Extension Manager GUI

  - type: systemd
    system:
      enabled:
        - power-profiles-daemon.service
        - podman.socket

  - type: script
    snippets:
      - echo "Configuring system defaults..."
      # Ensure container CLI compatibility
      - systemctl enable podman.socket
