# BlueBuild Recipe for Fedora Silverblue (AMD Zen 4 Optimized)
name: custom-silverblue-amd
description: Fedora Silverblue with Bazzite audio tweaks, AMD Ryzen 7 8845HS power tuning, and preinstalled dev tools.
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - usr: /usr
      - etc: /etc

  - type: rpm-ostree
    repos:
      # Brave Browser Official Repository
      - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
    install:
      # GUI & Management Tools
      - gnome-tweaks
      - gnome-shell-extension-manager
      - brave-browser

      # Container & Developer Tools
      - distrobox
      - podman-docker   # Emulates docker CLI via Podman to prevent daemon conflicts
      - wine
      - winetricks

      # AMD Codecs & GPU Acceleration (Mesa Driver Stack)
      - ffmpeg
      - gstreamer1-plugins-bad-freeworld
      - gstreamer1-plugins-ugly
      - mesa-va-drivers
      - mesa-vdpau-drivers
      - libva-utils
      - vulkan-tools
      - radeontop

      # System & Audio Components
      - pipewire-plugin-libspa-ffmpeg
      - wireplumber
      - power-profiles-daemon

  # Homebrew / Linuxbrew integration
  - type: brew
    auto-update: true
    auto-upgrade: true

  # Kernel parameters optimized for AMD Ryzen 7 8845HS (Zen 4) & Radeon 780M
  - type: kargs
    append:
      - amd_pstate=active             # Enable EPP (Energy Performance Preference) mode
      - amdgpu.ppfeaturemask=0xffffffff # Unlock full power management capabilities for Radeon 780M
      - pcie_aspm=force                # Enforce Active State Power Management on PCIe links

  # Post-install configuration scripts
  - type: script
    snippets:
      - |
        #!/usr/bin/bash
        set -e

        # -------------------------------------------------------------
        # 1. Bazzite-style PipeWire Sound Optimization
        # -------------------------------------------------------------
        mkdir -p /etc/pipewire/pipewire.conf.d
        cat << 'EOF' > /etc/pipewire/pipewire.conf.d/99-bazzite-audio.conf
        # Low-latency high-quality PipeWire defaults inspired by Bazzite OS
        context.properties = {
            default.clock.rate          = 48000
            default.clock.allowed-rates = [ 44100, 48000, 88200, 96000 ]
            default.clock.quantum       = 1024
            default.clock.min-quantum   = 32
            default.clock.max-quantum   = 2048
        }
        EOF

        # -------------------------------------------------------------
        # 2. Audio & Wireless Hardware Power Savings
        # -------------------------------------------------------------
        mkdir -p /etc/modprobe.d
        
        # Enable HDA Intel audio power saving (suspends audio chip when idle)
        echo "options snd_hda_intel power_save=1 power_save_controller=Y" > /etc/modprobe.d/audio_powersave.conf

        # -------------------------------------------------------------
        # 3. Enable Service Support
        # -------------------------------------------------------------
        systemctl enable power-profiles-daemon.service
        systemctl enable podman.socket
